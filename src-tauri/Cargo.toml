[package]
name = "geode"
version = "0.1.0"
description = "A fast, modern Minecraft launcher and mod manager"
edition = "2021"
rust-version = "1.77"
# Two binaries, so `cargo run` has to be told which one. Without this
# `npm run tauri dev` stops with "could not determine which binary to run",
# because the Tauri CLI runs plain `cargo run` and never names a target.
default-run = "geode"

[lib]
name = "geode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop app. Everything Tauri is behind the `desktop` feature, so this
# target is the one that needs a webview toolchain to build.
[[bin]]
name = "geode"
path = "src/main.rs"
required-features = ["desktop"]

# The server host, for a machine with no desktop at all. Built with
# `--no-default-features` and so with no Tauri, no wry and no WebKitGTK — which
# is the whole point of it: a container image that needs a webview to compile
# is not a headless anything.
[[bin]]
name = "geoded"
path = "src/bin/geoded.rs"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-deep-link",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
]

[build-dependencies]
# Optional for the same reason as `tauri` itself: a headless build has no
# `tauri.conf.json` to read and nothing to generate from it.
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
# `geode://` links. Single-instance must be registered first, and its
# `deep-link` feature is what hands a link to the copy already running.
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"], optional = true }
# Replacing Geode with a newer build off GitHub releases. Registered only in a
# build that was compiled with a public key to verify against — see
# `update.rs`. It asks `rustls` for `ring` only and installs that provider
# itself, so it does not reopen the choice the comment below warns about;
# `rustls` stays on one version. It does bring its own reqwest 0.13 alongside
# the 0.12 here, which is a second client over the same hyper rather than a
# second HTTP stack. Optional like the rest of Tauri: a host nobody sits at
# replaces itself the way everything else on it is replaced, by whoever pulls
# the image.
tauri-plugin-updater = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `signal` is what lets the server host hear a container stop: `docker stop`
# sends SIGTERM, and a Minecraft server killed instead of asked to stop loses
# whatever it had not saved.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net", "signal"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
url = "2"

# Serving a server's pack to players over TLS with a self-signed, pinned
# certificate. Every TLS crate is on `ring` with default features off: leaving
# them on pulls in aws-lc-rs beside the ring that reqwest already uses, and
# rustls then panics choosing between the two. `rustls` must stay the same
# 0.23 reqwest links, or `use_preconfigured_tls` fails at runtime, not compile.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1"] }
# One listener for IPv4 and IPv6 alike; Windows needs IPV6_V6ONLY set by hand.
socket2 = "0.6"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
# The console WebSocket `geoded` serves. Default features off: those are the
# *client* handshake, and this only ever takes over a connection hyper has
# already upgraded — `from_raw_socket` needs none of them. The server side of
# the handshake is three lines in `daemon/console.rs`, over the sha1 and base64
# already here, rather than another crate's worth of HTTP parsing.
tokio-tungstenite = { version = "0.30", default-features = false }
base64 = "0.22"

# Opening the pack port on the router over UPnP-IGD, so an admin never has to.
igd-next = { version = "0.17", default-features = false, features = ["aio_tokio"] }

thiserror = "2"
# Comparing the version a release manifest announces against this build's, so
# "newer" is a decision and not a string compare.
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
# `serde` and `std` are what `toml::Table` and `toml::to_string` are behind,
# and both are used — `instance/jar.rs` reads a mod's `fabric.mod.json`
# neighbour and `instance/prism.rs` writes Prism's `instance.cfg`. The desktop
# build compiled without asking for them because Tauri asks for them too; the
# headless build has no Tauri, and that is where the omission showed.
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "std"] }
# Finding one setting inside a Forge or NeoForge config and nothing else. The
# 145 TOML files measured under the `config/` folders on a real machine are the
# single biggest group, and the comments beside each setting are the only
# documentation it has, so `toml` itself is no use here: parse one of these to a
# map and print it back and 1150 bytes come out as 299, every comment gone, the
# keys alphabetised and the indentation lost. This reads where each value *is*
# — `toml_edit` reports a byte span per value — and the splice puts the new
# bytes there, so nothing outside the one setting is rewritten at all.
# Already resolved and vendored in this workspace at 0.25.13 by way of
# `proc-macro-crate` under `zbus_macros`, so nothing new is downloaded, and it
# does not move the Rust this needs: the `toml 1` above already wants 1.85.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
urlencoding = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
getrandom = "0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A fake UPnP gateway, so port mapping is tested without touching a real router.
mock-igd = "0.3"
# Paused time, so a two-minute wait is tested without taking two minutes.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "geode"
version = "0.1.0"
description = "A fast, modern Minecraft launcher and mod manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "geode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# `geode://` links. Single-instance must be registered first, and its
# `deep-link` feature is what hands a link to the copy already running.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Replacing Geode with a newer build off GitHub releases. Registered only in a
# build that was compiled with a public key to verify against — see
# `update.rs`. It asks `rustls` for `ring` only and installs that provider
# itself, so it does not reopen the choice the comment below warns about;
# `rustls` stays on one version. It does bring its own reqwest 0.13 alongside
# the 0.12 here, which is a second client over the same hyper rather than a
# second HTTP stack.
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
url = "2"

# Serving a server's pack to players over TLS with a self-signed, pinned
# certificate. Every TLS crate is on `ring` with default features off: leaving
# them on pulls in aws-lc-rs beside the ring that reqwest already uses, and
# rustls then panics choosing between the two. `rustls` must stay the same
# 0.23 reqwest links, or `use_preconfigured_tls` fails at runtime, not compile.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1"] }
# One listener for IPv4 and IPv6 alike; Windows needs IPV6_V6ONLY set by hand.
socket2 = "0.6"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# Opening the pack port on the router over UPnP-IGD, so an admin never has to.
igd-next = { version = "0.17", default-features = false, features = ["aio_tokio"] }

thiserror = "2"
# Comparing the version a release manifest announces against this build's, so
# "newer" is a decision and not a string compare.
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = { version = "1", default-features = false, features = ["parse", "display"] }
# Finding one setting inside a Forge or NeoForge config and nothing else. The
# 145 TOML files measured under the `config/` folders on a real machine are the
# single biggest group, and the comments beside each setting are the only
# documentation it has, so `toml` itself is no use here: parse one of these to a
# map and print it back and 1150 bytes come out as 299, every comment gone, the
# keys alphabetised and the indentation lost. This reads where each value *is*
# — `toml_edit` reports a byte span per value — and the splice puts the new
# bytes there, so nothing outside the one setting is rewritten at all.
# Already resolved and vendored in this workspace at 0.25.13 by way of
# `proc-macro-crate` under `zbus_macros`, so nothing new is downloaded, and it
# does not move the Rust this needs: the `toml 1` above already wants 1.85.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
urlencoding = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
getrandom = "0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A fake UPnP gateway, so port mapping is tested without touching a real router.
mock-igd = "0.3"
# Paused time, so a two-minute wait is tested without taking two minutes.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[package]
name = "geode"
version = "0.1.0"
description = "A fast, modern Minecraft launcher and mod manager"
edition = "2021"
rust-version = "1.77"

[lib]
name = "geode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }

thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
toml = { version = "1", default-features = false, features = ["parse"] }
tar = "0.4"
flate2 = "1"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
urlencoding = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
getrandom = "0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

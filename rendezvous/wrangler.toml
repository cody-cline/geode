# Deploy this directory as-is:
#
#   cd rendezvous
#   npx wrangler login     # once, in a browser
#   npx wrangler deploy
#
# There is no scaffold to generate and no file to copy: `worker.js` beside this
# is the whole service.

name = "geode-rendezvous"
main = "worker.js"
compatibility_date = "2026-09-01"

# One object per share key. SQLite-backed, which is what buys the 100,000 daily
# writes — the limit that actually binds, since creating a share is one write.
[[durable_objects.bindings]]
name = "SHARES"
class_name = "ShareRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareRegistry"]

# Nothing is observable about a share beyond the fact that one existed, and the
# object deletes itself on its alarm, so there is nothing here worth sampling.
[observability]
enabled = true
head_sampling_rate = 0.1
